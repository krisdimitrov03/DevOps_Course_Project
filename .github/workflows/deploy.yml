name: CI/CD Pipeline - Build, Push & Deploy

on:
  push:
    branches: [ "develop" ]

jobs:

  build_and_push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/krisdimitrov03/devops_course_project:latest

  provision_infra:
    name: Provision Infrastructure with Terraform
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - name: Check out repository
        uses: actions/checkout@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: "eu-north-1"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.5.2'

      - name: Initialize Terraform
        run: terraform init

      - name: Validate Terraform
        run: terraform validate

      - name: Apply Terraform (Provision EC2 if Not Exists)
        run: terraform apply -auto-approve

  deploy_app:
    name: Deploy Application with Ansible
    runs-on: ubuntu-latest
    needs: provision_infra
    env:
      EC2_PUBLIC_IP: ${{ secrets.EC2_PUBLIC_IP }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v2

      - name: Install Ansible
        run: |
          sudo apt update
          sudo apt install -y ansible

      - name: Verify EC2 Public IP
        run: |
          echo "Using EC2 Public IP: $EC2_PUBLIC_IP"
        shell: bash

      - name: Configure SSH Access
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          if [[ -n "$EC2_PUBLIC_IP" ]]; then
            ssh-keyscan -H "$EC2_PUBLIC_IP" >> ~/.ssh/known_hosts
          else
            echo "ERROR: EC2_PUBLIC_IP is not defined!"
            exit 1
          fi
        shell: bash

      - name: Test SSH Connection
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ubuntu@"$EC2_PUBLIC_IP" "echo SSH Connection Successful"
        shell: bash

      - name: Run Ansible Playbook
        run: ansible-playbook -i "$EC2_PUBLIC_IP," -u ubuntu playbook.yml
        env:
          ANSIBLE_HOST_KEY_CHECKING: False
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.ACCESS_TOKEN }}
